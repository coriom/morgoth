# Crypto domain pack — chantier 1 of 5 of the domain-pack refactor.
#
# Pure DATA. No Python. Every value here was previously a hard-coded
# constant in core/, analysis/, or self_modify/; grep-locked in
# tests/test_domain_pack_locks.py so no literal drifts back to code.
#
# Crypto stays in the current Postgres schema + Chroma collections
# — this pack is a LITERAL EXTRACTION, not a behaviour change. A
# byte-identical before/after is the acceptance criterion.

name: crypto
tagline: "crypto and finance research"

# Installed implementations become active only through this Domain rail.
# get_crypto_history remains callable for bootstrap tests but is neither
# an autonomous source nor a chat-schema tool, as before.
rail:
  tools:
    - web_search
    - fred_series_observations
    - fred_series_search
    - technical_analysis
    - get_bitcoin_futures_funding
    - get_bitcoin_long_short_ratio
    - get_bitcoin_onchain
    - get_coinbase_btc_stats
    - get_crypto_global_market
    - get_crypto_history
    - get_crypto_price
    - get_deribit_btc_perpetual
    - get_ethereum_network_stats
    - get_fear_greed_index
    - get_news

# ---------------------------------------------------------------------
# Subject / prompt vocab
# ---------------------------------------------------------------------

# core/campaign.py::_GENERIC_SUBJECT_TOKENS — asset/market qualifiers
# too generic to prove a title stays on-subject.
generic_subject_tokens:
  [btc, bitcoin, eth, ethereum, crypto, cryptocurrency, market, markets, price, prices]

# core/contradictions.py::PRICE_CLASS_TOKENS — substring markers that
# flip the contradiction window from long (8h) to short (2h).
semantic_classes:
  price: [price, change, trend, volume]
semantic_windows_hours:
  default: 6.0
  price: 2.0
semantic_window_env:
  default: CONTRADICTION_WINDOW_HOURS
  price: CONTRADICTION_WINDOW_HOURS_PRICE

# Directional price scorer's entity vocabulary and exclusions.
entities:
  bitcoin: [btc, bitcoin]
  ethereum: [eth, ethereum]
entity_required_phrases: [price]
entity_excluded_phrases:
  [gas, long-term, long term, hash rate, network congestion, funding, dominance]

# core/contradictions.py::_SUBJECT_PREFIX_STOPWORDS — prefixes stripped
# for contradiction GROUPING ONLY. Stored subjects are NOT rewritten.
subject_prefix_stopwords: [global, crypto, the]

# self_modify/reflect.py::_NAME_STOPWORDS — tokens that do not
# contribute distinctiveness to a proposed tool_name. Mixes generic
# English (get/fetch/the/a/an/tool) with domain framing (btc/bitcoin/
# eth/…) and generic containers (data/info/stats/index) and utility
# tool names (recall/remember/notify). Kept as one flat list per the
# literal-extraction rule; a future refactor could split into
# language vs domain vs framework subsets.
name_stopwords:
  - get
  - fetch
  - the
  - a
  - an
  - tool
  - btc
  - bitcoin
  - eth
  - ethereum
  - crypto
  - cryptocurrency
  - data
  - info
  - stats
  - index
  - recall
  - remember
  - notify

