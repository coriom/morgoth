# ---------------------------------------------------------------------
# Prompt bootstrap / defaults — core/brain.py
# ---------------------------------------------------------------------

# Injected into the "no active objectives" prompt path so a fresh
# rail can seed one.
prompt_bootstrap_snippet: |
  NO ACTIVE OBJECTIVES.

  STEP 1: Call get_crypto_price with symbol='bitcoin' to scan markets.
  STEP 2: After receiving the price, IMMEDIATELY call create_objective with a title and description based on what you observed. Pick a specific topic to investigate next (e.g., on-chain metrics, sentiment shift, news event, technical pattern).

  MANDATORY: end this cycle by calling create_objective. Do not narrate. Tool calls only.

# core/brain.py objectives_test_bootstrap defaults.
test_bootstrap_tool_defaults:
  get_crypto_price:
    symbol: bitcoin
  get_crypto_history:
    symbol: bitcoin
    days: 1

# ---------------------------------------------------------------------
# Source cache polling schedule — core/source_cache.py
# ---------------------------------------------------------------------

source_cache_config:
  get_fear_greed_index: [21600, 93600]           # 6h poll, 26h stale
  get_bitcoin_onchain: [600, 2400]               # 10min, 40min
  get_bitcoin_futures_funding: [1800, 7200]      # 30min, 2h
  get_bitcoin_long_short_ratio: [1800, 7200]
  fred_series_observations: [43200, 172800]      # 12h, 48h
  get_coinbase_btc_stats: [900, 3600]            # 15min, 1h
  get_ethereum_network_stats: [300, 1200]        # 5min, 20min
  get_news: [1200, 3600]                         # 20min, 1h

source_cache_default_args:
  fred_series_observations:
    series_id: CPIAUCSL
