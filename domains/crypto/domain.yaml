# ---------------------------------------------------------------------
# Classifier tables — campaign_quality error classes
# ---------------------------------------------------------------------

# _BULLISH_WORDS / _BEARISH_WORDS — only UNAMBIGUOUS direction claims.
bullish_words:
  - bullish
  - bull
  - buyer
  - buyers
  - more buyers
  - buying pressure
  - upward
  - positive sentiment

bearish_words:
  - bearish
  - bear
  - seller
  - sellers
  - more sellers
  - selling pressure
  - downward
  - negative sentiment

# METRIC_FAMILIES — used only for fragmentation counting; a subject
# containing one of these keywords is bucketed into that family.
metric_families:
  funding_rate: [funding rate, funding_rate, perpetual funding]
  long_short: [long-short, long/short, long short, positioning, long account, short account]
  hashrate: [hashrate, hash rate, hash-rate, network hash]
  difficulty: [difficulty]
  dominance: [dominance]
  mempool: [mempool, unconfirmed]
  gas: [gas price, gwei]
  fear_greed: [fear, greed, sentiment index]
  market_cap: [market cap, market_cap, marketcap]
  trading_volume: [trading volume, 24h volume, 24-hour volume]

